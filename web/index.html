<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComfiMap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: "Avenir Next", "Segoe UI", sans-serif; color: #142033; }
    .panel {
      position: absolute;
      z-index: 1000;
      top: 14px;
      left: 14px;
      width: min(360px, calc(100vw - 28px));
      padding: 14px 14px 12px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(7, 16, 38, 0.22);
    }
    h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.03em; }
    .sub { margin: 0 0 10px; color: #526074; font-size: 13px; line-height: 1.35; }
    label { display: block; font-size: 12px; font-weight: 650; margin: 8px 0 4px; }
    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d5dbe6;
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      font-size: 14px;
      background: white;
    }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 9px 12px;
    }
    button.primary { width: 100%; margin-top: 10px; background: #01112f; color: white; font-weight: 700; }
    button:disabled { opacity: 0.55; cursor: wait; }
    input[type="range"] { width: 100%; accent-color: #01112f; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .stat { background: #f4f7fb; border-radius: 12px; padding: 8px; }
    .stat b { display: block; font-size: 14px; }
    .stat span { color: #526074; font-size: 11px; }
    .msg { min-height: 1.2em; margin: 8px 0 0; font-size: 13px; color: #526074; }
    .msg.error { color: #9b1c1c; }
    #routes { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <h1>ComfiMap</h1>
    <p class="sub">The slider picks a walk that trades a little distance for less heat.</p>
    <label for="origin">Start</label>
    <input id="origin" type="text" value="Battery Park, New York" />
    <label for="destination">Destination</label>
    <input id="destination" type="text" value="City Hall, New York" />
    <div class="row">
      <div>
        <label for="month">Month</label>
        <select id="month"></select>
      </div>
      <div>
        <label for="hour">Hour</label>
        <select id="hour"></select>
      </div>
    </div>
    <button id="find" class="primary" type="button">Find walks</button>
    <div id="routes">
      <label for="balance">Balance distance and heat</label>
      <input id="balance" type="range" min="0" max="0" value="0" />
      <div class="stats">
        <div class="stat"><b id="walk">–</b><span>Walk</span></div>
        <div class="stat"><b id="extra">–</b><span>Longer than shortest</span></div>
        <div class="stat"><b id="heat">–</b><span>Heat vs shortest</span></div>
      </div>
    </div>
    <p id="status" class="msg"></p>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const START = { lat: 40.71427, lng: -74.00597, zoom: 15 };
    const MONTH_NAMES = ["", "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const statusEl = document.getElementById("status");
    const monthSelect = document.getElementById("month");
    const hourSelect = document.getElementById("hour");

    let options = { months: {} };
    let routeData = [];
    let routeLayers = [];

    function hourLabel(hour) {
      if (hour === 0) return "12 AM";
      if (hour < 12) return `${hour} AM`;
      if (hour === 12) return "12 PM";
      return `${hour - 12} PM`;
    }

    function fillHours() {
      const hours = options.months[monthSelect.value] || [];
      const previous = hourSelect.value;
      hourSelect.innerHTML = "";
      for (const hour of hours) {
        const option = document.createElement("option");
        option.value = String(hour);
        option.textContent = hourLabel(hour);
        hourSelect.appendChild(option);
      }
      if (hours.map(String).includes(previous)) hourSelect.value = previous;
      else if (hours.includes(14)) hourSelect.value = "14";
    }

    function fillMonths() {
      monthSelect.innerHTML = "";
      const months = Object.keys(options.months).map(Number).sort((a, b) => a - b);
      for (const month of months) {
        const option = document.createElement("option");
        option.value = String(month);
        option.textContent = MONTH_NAMES[month] || String(month);
        monthSelect.appendChild(option);
      }
      if (months.includes(7)) monthSelect.value = "7";
      fillHours();
    }

    const map = L.map("map", { zoomControl: false }).setView([START.lat, START.lng], START.zoom);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap",
    }).addTo(map);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    function clearRoutes() {
      for (const layer of routeLayers) map.removeLayer(layer);
      routeLayers = [];
    }

    function showRoute(index, fit) {
      clearRoutes();
      routeData.forEach((route, i) => {
        for (const line of route.lines) {
          routeLayers.push(L.polyline(line, {
            color: i === index ? "#ff5a1f" : "#8b95a5",
            weight: i === index ? 7 : 4,
            opacity: i === index ? 0.95 : 0.75,
          }).addTo(map));
        }
      });
      const route = routeData[index];
      const minutes = route.minutes < 1 ? "< 1 min" : `${Math.round(route.minutes)} min`;
      document.getElementById("walk").textContent = `${minutes} (${Math.round(route.distance_m)} m)`;
      document.getElementById("extra").textContent = `${Math.round(route.extra_m)} m`;
      document.getElementById("heat").textContent = route.heat_saved_pct < 0.5 ? "Same" : `${Math.round(route.heat_saved_pct)}% lower`;
      if (fit && route.lines.length) {
        const bounds = L.latLngBounds(route.lines.flat());
        map.fitBounds(bounds, { paddingTopLeft: [380, 40], paddingBottomRight: [40, 40], maxZoom: 17 });
      }
    }

    document.getElementById("find").addEventListener("click", async () => {
      const button = document.getElementById("find");
      button.disabled = true;
      statusEl.className = "msg";
      statusEl.textContent = "Comparing walks…";
      const month = Number(monthSelect.value);
      const hour = Number(hourSelect.value);
      try {
        const response = await fetch("/api/routes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            origin: document.getElementById("origin").value,
            destination: document.getElementById("destination").value,
            month: month,
            hour: hour,
          }),
        });
        const raw = await response.text();
        if (!raw) {
          throw new Error("The server restarted. Wait about 20 seconds, then press Find walks again.");
        }
        let payload;
        try {
          payload = JSON.parse(raw);
        } catch (parseError) {
          throw new Error("The server restarted. Wait about 20 seconds, then press Find walks again.");
        }
        if (!response.ok) throw new Error(payload.detail || "Could not find walks");
        routeData = payload.routes;
        const balance = document.getElementById("balance");
        balance.max = String(Math.max(routeData.length - 1, 0));
        balance.value = String(payload.selected || 0);
        document.getElementById("routes").style.display = "block";
        showRoute(+balance.value, true);
        statusEl.textContent = `${payload.origin_name} → ${payload.destination_name}. Heat model: ${MONTH_NAMES[month]}, ${hourLabel(hour)}.`;
      } catch (error) {
        statusEl.className = "msg error";
        statusEl.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("balance").addEventListener("input", (event) => {
      if (routeData.length) showRoute(+event.target.value, false);
    });
    monthSelect.addEventListener("change", fillHours);

    fetch("/api/options").then((response) => response.json()).then((payload) => {
      options = payload;
      fillMonths();
    });
  </script>
</body>
</html>
